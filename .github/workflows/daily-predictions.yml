name: Pronostics quotidiens

on:
  schedule:
    - cron: "13 6 * * *"
      timezone: "Africa/Lome"
  workflow_dispatch:
    inputs:
      force:
        description: "Republier même si l'analyse du jour existe déjà"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: actu-poster-predictions
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      PREDICTIONS_BOT_TOKEN: ${{ secrets.PREDICTIONS_BOT_TOKEN }}
      PREDICTIONS_CHANNEL_ID: ${{ secrets.PREDICTIONS_CHANNEL_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FORCE_RUN: ${{ inputs.force || 'false' }}
      APP_TIMEZONE: "Africa/Lome"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restaurer l'état quotidien
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: actu-poster-predictions-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            actu-poster-predictions-

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Générer et publier les pronostics
        run: python main3.py

      - name: Sauvegarder l'état quotidien
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .state
          key: actu-poster-predictions-${{ github.run_id }}-${{ github.run_attempt }}
